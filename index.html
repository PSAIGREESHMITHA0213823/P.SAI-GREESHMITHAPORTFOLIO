  <body>
    <div id="root"></div>
    <!--
      Netlify Forms registration. Netlify finds this static form at deploy time and accepts
      submissions for "project-inquiry"; the React contact form posts to it. Keep the field
      names in sync with src/sections/Contact.tsx.
    -->
    <form name="project-inquiry" data-netlify="true" netlify-honeypot="website" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="projectType" />
      <input type="text" name="budget" />
      <textarea name="message"></textarea>
      <input type="text" name="website" />
    </form>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        P.SAI GREESHMITHA — Software Engineer | Full Stack Developer. This portfolio needs JavaScript to run.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
